schema: spec-driven

context: |
  Tech stack: TypeScript, NestJS 11, Node.js, PostgreSQL (Kysely query builder), JWT + Passport, Swagger, Jest, bcrypt
  Package manager: pnpm (never npm/yarn)
  API style: RESTful, documented via Swagger at /api
  Testing: Jest with ts-jest, unit tests (*.spec.ts) co-located, e2e tests (*.e2e-spec.ts) in test/
  Architecture: Hexagonal (Ports & Adapters) - see .agents/skills/hexagonal-architecture/
  TDD approach: Vertical tracer bullets - one test → one implementation → repeat (see .agents/skills/tdd/)
  Domain: Educational platform for real-time exercises ("Robinhoot")

rules:
  apply:
    - 'Follow Test-Driven Development (TDD): write one test for one behavior, then minimal implementation. No horizontal slicing.'
    - 'Adhere to Hexagonal Architecture principles: domain has no external dependencies, ports are interfaces in application/, adapters are in infrastructure/. Dependency direction always inward.'
    - 'Use DI tokens (Symbols) for port implementations, never inject concrete infrastructure classes into application services.'
    - 'Keep validation at boundaries: NestJS pipes/DTOs in inbound adapters + use-case invariants in application services.'
  proposal:
    - Include rollback plan
    - Identify affected teams
    - Reference existing patterns before inventing new ones
  specs:
    - Use Given/When/Then format for behavioral specs
    - Focus on public interface behavior, not implementation details
