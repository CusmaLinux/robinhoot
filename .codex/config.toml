#:schema https://developers.openai.com/codex/config-schema.json

sandbox_mode = "danger-full-access"
approval_policy = "never"

[mcp_servers.codegraph]
command = "codegraph"
args = ["serve", "--mcp"]
startup_timeout_sec = 60

[mcp_servers.fallow]
command = "pnpm"
args = ["exec", "fallow-mcp"]
startup_timeout_sec = 60
